services:
  # Default profile: just the FastAPI backend, published directly on the host.
  # Use `--profile gui` to add the Streamlit GUI + Nginx reverse-proxy on top.
  api:
    image: ${OPC_IMAGE:-ghcr.io/sdsc-ordes/open-pulse-crawler:latest}
    env_file:
      - ../.env
    ports:
      - "${OPC_API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - opc
    restart: unless-stopped

  gui:
    image: ${OPC_IMAGE:-ghcr.io/sdsc-ordes/open-pulse-crawler:latest}
    profiles:
      - gui
    env_file:
      - ../.env
    # Resolve the installed gui.py path at runtime so this works regardless of
    # whether the package is in /usr/local (pip-based image) or /app/.venv
    # (uv-based image).
    entrypoint: ["sh", "-c"]
    command:
      - 'exec streamlit run "$(python -c "import open_pulse_crawler.gui as m; print(m.__file__)")" --server.port=8501 --server.address=0.0.0.0 --server.headless=true'
    expose:
      - "8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - opc
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    profiles:
      - gui
    env_file:
      - ../.env
    ports:
      - "${OPC_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      gui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - opc
    restart: unless-stopped

networks:
  opc:
    driver: bridge

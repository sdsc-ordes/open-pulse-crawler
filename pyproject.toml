[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-pulse-crawler"
version = "3.0.0"
description = "GitHub BFS Crawler - Discover users, organizations, and repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache 2.0" }
authors = [
  { name = "caviri" }
]
dependencies = [
  "pygithub>=2.1.1",
  "python-gitlab>=4.0,<6",
  "pydantic>=2.0.0",
  "typer>=0.9.0,<0.10.0",
  "click<8.2.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
  "tqdm>=4.66.0",
  "scipy==1.16.2",
  "github-dependents-info>=1.6.3",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "streamlit>=1.30.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
viz = [
  "networkx>=3.0",
  "matplotlib>=3.7.0",
  "adjustText>=1.3.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-xdist>=3.6.0",
  "black>=23.0.0",
  "ruff>=0.1.0",
  "httpx>=0.27.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "pymdown-extensions>=10.7.0",
]

[project.urls]
Homepage = "https://github.com/sdsc-ordes/open-pulse-crawler"

[project.scripts]
open-pulse-crawler = "open_pulse_crawler.cli:main"
# Short alias — the docs use `opc` throughout.
opc = "open_pulse_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_pulse_crawler"]

[tool.hatch.build]
packages = ["src/open_pulse_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist=loadfile"
markers = [
  "integration: marks slower integration tests",
]

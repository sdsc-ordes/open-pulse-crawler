services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - opc
    restart: unless-stopped

  gui:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    entrypoint: ["streamlit", "run"]
    command:
      - /usr/local/lib/python3.12/site-packages/open_pulse_crawler/gui.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    expose:
      - "8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - opc
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${OPC_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      gui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - opc
    restart: unless-stopped

networks:
  opc:
    driver: bridge

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-pulse-crawler"
version = "0.1.0"
description = "GitHub BFS Crawler - Discover users, organizations, and repositories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache 2.0" }
authors = [
  { name = "caviri" }
]
dependencies = [
  "pygithub>=2.1.1",
  "pydantic>=2.0.0",
  "typer>=0.9.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
viz = [
  "networkx>=3.0",
  "matplotlib>=3.7.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "black>=23.0.0",
  "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/sdsc-ordes/open-pulse-crawler"

[project.scripts]
open-pulse-crawler = "open_pulse_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_pulse_crawler"]

[tool.hatch.build]
packages = ["src/open_pulse_crawler"]
